# TongLink Studio 默认配置：轻量模式（单容器 / 单进程 / SQLite）
# 数据源完全由环境变量驱动，同一份 jar 可切换 SQLite / PostgreSQL：
#   SQLite    （默认）：不设 DB_URL，使用 ./data/tonglink.db
#   PostgreSQL：DB_URL=jdbc:postgresql://host:5432/tonglink DB_USER=... DB_PASSWORD=...
# 不指定 driver-class-name，Spring Boot 会依据 URL 前缀自动选择 sqlite / postgresql 驱动。
spring:
  application:
    name: tonglink-studio
  datasource:
    url: ${DB_URL:jdbc:sqlite:${TONGLINK_DB_PATH:./data/tonglink.db}}
    username: ${DB_USER:sa}
    password: ${DB_PASSWORD:}
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:5}
      minimum-idle: ${DB_MIN_IDLE:2}
      connection-timeout: ${DB_CONNECTION_TIMEOUT:30000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT:5000}
      # 实测：PG 服务端无 idle 超时，断链来自中间网络回收空闲 TCP 会话。
      # 30 秒保活探测 + 5 分钟强制轮换，把「借到已断开连接」的窗口压到最小。
      max-lifetime: ${DB_MAX_LIFETIME:300000}
      keepalive-time: ${DB_KEEPALIVE_TIME:30000}
      idle-timeout: ${DB_IDLE_TIMEOUT:120000}
      connection-test-query: SELECT 1
      # 数据库短暂不可用时也先启动，由 Hikari 后台持续重连，避免 IDEA 重启卡在启动阶段
      initialization-fail-timeout: ${DB_INIT_FAIL_TIMEOUT:-1}
      leak-detection-threshold: ${DB_LEAK_DETECTION_THRESHOLD:60000}
  sql:
    init:
      mode: always
      schema-locations: classpath:schema.sql
      continue-on-error: false
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  mvc:
    static-path-pattern: /**

server:
  port: ${SERVER_PORT:8080}
  shutdown: graceful

tonglink:
  # AES-GCM 主密钥，生产必须通过环境变量覆盖
  crypto:
    key: ${TONGLINK_CRYPTO_KEY:tonglink-studio-dev-key-change-me}
  jwt:
    secret: ${TONGLINK_JWT_SECRET:tonglink-studio-local-jwt-secret-must-be-long-enough}
    ttl-seconds: 86400
  # inmemory = 轻量/标准模式；redis = 队列模式
  queue:
    type: ${TONGLINK_QUEUE_TYPE:inmemory}
  redis:
    uri: ${TONGLINK_REDIS_URI:redis://localhost:6379}
  scheduler:
    interval-ms: 5000
  runner:
    node-command: ${TONGLINK_NODE_CMD:node}
    python-command: ${TONGLINK_PYTHON_CMD:python3}
    python-fallback: ${TONGLINK_PYTHON_FALLBACK:python}
  # 外网代理：IDEA 启动时若未继承 shell 的代理变量，可在这里或环境变量里指定
  http:
    proxy: ${TONGLINK_HTTP_PROXY:${HTTPS_PROXY:${https_proxy:${HTTP_PROXY:${http_proxy:}}}}}
  # 流程内数据库节点的连接池（与平台元数据库池相互独立）
  jdbc:
    pool-size: ${TONGLINK_JDBC_POOL_SIZE:8}
    max-lifetime-ms: ${TONGLINK_JDBC_MAX_LIFETIME_MS:1500000}
    connection-timeout-ms: ${TONGLINK_JDBC_CONNECT_TIMEOUT_MS:10000}
  # 内置「测试」项目使用的 MySQL 测试库，可用环境变量覆盖
  test:
    mysql:
      jdbc-url: ${TONGLINK_TEST_MYSQL_JDBC_URL:jdbc:mysql://127.0.0.1:3306/weather?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&connectTimeout=5000}
      username: ${TONGLINK_TEST_MYSQL_USERNAME:root}
      password: ${TONGLINK_TEST_MYSQL_PASSWORD:change-me}
  ai:
    provider: ${TONGLINK_AI_PROVIDER:local}
    endpoint: ${TONGLINK_AI_ENDPOINT:}
    api-key: ${TONGLINK_AI_API_KEY:}
    model: ${TONGLINK_AI_MODEL:gpt-4o-mini}

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

logging:
  level:
    cn.tonglink: INFO
